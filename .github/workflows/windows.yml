name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Release or Debug)
        type: string
        default: Release
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']

permissions: {}

jobs:
  build:
    name: Build (Windows MSVC, Qt 6.11.2)
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write # vcpkg binary cache (GitHub Packages / NuGet)
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_NAME: Windows-MSVC-Qt6
      BUILD_PLATFORM: nitruran
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ci
      # Repo secret: Settings > Secrets and variables > Actions > MSA_CLIENT_ID
      MSA_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
      # Repo secret: your CurseForge API key made for applications (never commit it)
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Require secrets
        run: |
          if [ -z "$MSA_CLIENT_ID" ]; then
            echo "::error::Secret MSA_CLIENT_ID is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Prepare Windows resources
        run: |
          for suffix in rc.in qrc.in manifest.in ico; do
            cp "program_info/prismlauncher.$suffix" "program_info/nitruran.$suffix"
          done

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D Launcher_MSA_CLIENT_ID="$MSA_CLIENT_ID" \
            -D Launcher_CURSEFORGE_API_KEY="$CURSEFORGE_API_KEY" \
            -D Launcher_APP_BINARY_NAME=nitruran \
            -D Launcher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}" \
            -D Launcher_BUG_TRACKER_URL="https://github.com/${{ github.repository }}/issues" \
            -D Launcher_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Test
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Package portable build and installer
        shell: pwsh
        env:
          NSCURL_VERSION: v24.9.26.122
          NSCURL_SHA256: AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0
        run: |
          cmake --install build --config $env:BUILD_TYPE
          Copy-Item -Recurse install install-portable
          cmake --install build --config $env:BUILD_TYPE --prefix install-portable --component portable
          Compress-Archive -Path install-portable\* -DestinationPath Nitruran-Windows-MSVC-Portable.zip

          New-Item -ItemType Directory -Force -Path NSISPlugins | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/negrutiu/nsis-nscurl/releases/download/$env:NSCURL_VERSION/NScurl.zip" `
            -OutFile NSISPlugins\NScurl.zip
          if ((Get-FileHash NSISPlugins\NScurl.zip -Algorithm SHA256).Hash -ne $env:NSCURL_SHA256) {
            throw "NScurl.zip SHA256 mismatch"
          }
          Expand-Archive -Path NSISPlugins\NScurl.zip -DestinationPath NSISPlugins\NScurl -Force

          Push-Location install
          makensis -NOCD "../build/program_info/win_install.nsi"
          Pop-Location
          Move-Item Nitruran-Setup.exe Nitruran-Windows-MSVC-Setup.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nitruran-Windows-x64
          path: |
            Nitruran-Windows-MSVC-Portable.zip
            Nitruran-Windows-MSVC-Setup.exe

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nitruran-Windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created or edited by hand): upload to it instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              Nitruran-Windows-MSVC-Setup.exe Nitruran-Windows-MSVC-Portable.zip
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
              Nitruran-Windows-MSVC-Setup.exe Nitruran-Windows-MSVC-Portable.zip
          fi
